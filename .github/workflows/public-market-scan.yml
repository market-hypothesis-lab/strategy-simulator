name: Public market scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-market-scan
  cancel-in-progress: true

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    environment: public-scan-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public compute code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run dependency-free Node.js tests
        run: npm run test:node

      - name: Fetch, compute, and publish the authenticated scan
        env:
          PUBLIC_SCAN_BASE_URL: ${{ vars.PUBLIC_SCAN_BASE_URL }}
          PUBLIC_SCAN_HMAC_SECRET: ${{ secrets.PUBLIC_SCAN_HMAC_SECRET }}
        run: npm run scan
